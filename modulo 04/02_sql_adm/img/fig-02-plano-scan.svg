<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="340" fill="#ffffff"/>
  <rect x="10" y="10" width="880" height="320" fill="#fbfbfb" stroke="#c8c8c8"/>
  <rect x="10" y="10" width="880" height="24" fill="#e1e8ef" stroke="#c8c8c8"/>
  <text x="20" y="27" font-size="12" font-weight="bold" fill="#243b53">Plano de Execução Real — ANTES do índice</text>
  <text x="20" y="52" font-size="11" fill="#555">Consulta 1: custo da consulta (relativo ao lote): 100%</text>
  <text x="20" y="70" font-family="Consolas, monospace" font-size="11" fill="#333">SELECT ... FROM dbo.nota_fiscal WHERE cnpj_emitente = '11222333000144' AND dt_emissao BETWEEN ...</text>

  <!-- SELECT -->
  <g>
    <rect x="60" y="150" width="110" height="66" rx="4" fill="#ffffff" stroke="#7f9db9"/>
    <circle cx="115" cy="172" r="12" fill="#eaf1f8" stroke="#7f9db9"/>
    <text x="109" y="177" font-size="12" fill="#3a5c7d">▶</text>
    <text x="115" y="197" font-size="11" text-anchor="middle" fill="#222">SELECT</text>
    <text x="115" y="211" font-size="10" text-anchor="middle" fill="#666">Custo: 0%</text>
  </g>
  <!-- seta -->
  <line x1="230" y1="183" x2="175" y2="183" stroke="#5a7fa5" stroke-width="9"/>
  <polygon points="175,183 190,175 190,191" fill="#5a7fa5"/>
  <text x="182" y="167" font-size="10" fill="#5a7fa5">5 linhas</text>

  <!-- Hash Match Aggregate -->
  <g>
    <rect x="232" y="150" width="130" height="66" rx="4" fill="#ffffff" stroke="#7f9db9"/>
    <circle cx="297" cy="172" r="12" fill="#eaf1f8" stroke="#7f9db9"/>
    <text x="291" y="177" font-size="12" fill="#3a5c7d">Σ</text>
    <text x="297" y="197" font-size="11" text-anchor="middle" fill="#222">Hash Match</text>
    <text x="297" y="211" font-size="10" text-anchor="middle" fill="#666">(Aggregate) — 12%</text>
  </g>
  <line x1="470" y1="183" x2="367" y2="183" stroke="#5a7fa5" stroke-width="26"/>
  <polygon points="367,183 388,164 388,202" fill="#5a7fa5"/>
  <text x="392" y="152" font-size="10" fill="#5a7fa5">12.480 linhas</text>

  <!-- Clustered Index Scan -->
  <g>
    <rect x="472" y="140" width="200" height="86" rx="4" fill="#fff4f4" stroke="#c96a6a" stroke-width="2"/>
    <circle cx="572" cy="164" r="13" fill="#fde8e8" stroke="#c96a6a"/>
    <text x="566" y="169" font-size="13" fill="#a33" font-weight="bold">S</text>
    <text x="572" y="190" font-size="11" text-anchor="middle" font-weight="bold" fill="#222">Clustered Index Scan</text>
    <text x="572" y="205" font-size="10" text-anchor="middle" fill="#444">[nota_fiscal].[PK_nota_fiscal]</text>
    <text x="572" y="219" font-size="10" text-anchor="middle" fill="#a33" font-weight="bold">Custo: 88%</text>
  </g>

  <!-- tooltip -->
  <rect x="700" y="60" width="180" height="118" rx="3" fill="#ffffe1" stroke="#9a9a6a"/>
  <text x="710" y="76" font-size="10" font-weight="bold" fill="#333">Clustered Index Scan</text>
  <g font-size="9.5" fill="#444">
    <text x="710" y="94">Linhas lidas:       1.000.000</text>
    <text x="710" y="110">Linhas retornadas:     12.480</text>
    <text x="710" y="126">Leituras lógicas:      8.412</text>
    <text x="710" y="142">Tempo decorrido:      1.980 ms</text>
    <text x="710" y="160">Predicado: cnpj_emitente = ...</text>
  </g>
  <line x1="700" y1="150" x2="672" y2="164" stroke="#9a9a6a" stroke-dasharray="3,2"/>

  <!-- alerta -->
  <rect x="20" y="256" width="860" height="58" rx="4" fill="#fff8e5" stroke="#e0c068"/>
  <text x="32" y="276" font-size="11" font-weight="bold" fill="#7a5c00">⚠ Leia assim:</text>
  <text x="32" y="294" font-size="11" fill="#5c4600">A operação mais custosa (88%) é um SCAN — o SQL Server leu as 1.000.000 de linhas da tabela para devolver apenas 12.480.</text>
  <text x="32" y="309" font-size="11" fill="#5c4600">A seta grossa indica alto volume de linhas trafegando. Este é o sintoma clássico de ausência de índice adequado.</text>
</svg>
