<text x="748" y="170" font-family="DejaVu Sans, Segoe UI, Verdana, sans-serif" font-size="10.5" fill="#1f2933">Navegacao</text>
<text x="748" y="190" font-family="DejaVu Sans, Segoe UI, Verdana, sans-serif" font-size="10.5" fill="#1f2933">Linhas Filtradas (situacao)</text>
<text x="748" y="210" font-family="DejaVu Sans, Segoe UI, Verdana, sans-serif" font-size="10.5" fill="#1f2933">Linhas Filtradas (periodo)</text>
<text x="748" y="230" font-family="DejaVu Sans, Segoe UI, Verdana, sans-serif" font-size="10.5" fill="#1f2933">Outras Colunas Removidas</text>
<text x="748" y="250" font-family="DejaVu Sans, Segoe UI, Verdana, sans-serif" font-size="10.5" fill="#0b57d0" font-weight="700">Tipo Alterado</text>
<text x="748" y="270" font-family="DejaVu Sans, Segoe UI, Verdana, sans-serif" font-size="10.5" fill="#1f2933">Consultas Mescladas (efd)</text>
<text x="748" y="290" font-family="DejaVu Sans, Segoe UI, Verdana, sans-serif" font-size="10.5" fill="#1f2933">Coluna Personalizada</text>
<rect x="756" y="256" width="196" height="106" rx="0" fill="#ffffff" stroke="#8a8a8a" stroke-width="1"/>
<text x="764" y="274" font-family="DejaVu Sans, Segoe UI, Verdana, sans-serif" font-size="10.5" fill="#1f2933">Editar Configuracoes</text>
<text x="764" y="292" font-family="DejaVu Sans, Segoe UI, Verdana, sans-serif" font-size="10.5" fill="#1f2933">Renomear</text>
<text x="764" y="310" font-family="DejaVu Sans, Segoe UI, Verdana, sans-serif" font-size="10.5" fill="#1f2933">Excluir</text>
<text x="764" y="328" font-family="DejaVu Sans, Segoe UI, Verdana, sans-serif" font-size="10.5" fill="#0b57d0" font-weight="700">Exibir Consulta Nativa</text>
<text x="764" y="346" font-family="DejaVu Sans, Segoe UI, Verdana, sans-serif" font-size="10.5" fill="#1f2933">Propriedades...</text>
<text x="742" y="384" font-family="DejaVu Sans, Segoe UI, Verdana, sans-serif" font-size="11" fill="#b3261e" font-weight="700">Cada clique vira uma etapa M -</text>
<text x="742" y="400" font-family="DejaVu Sans, Segoe UI, Verdana, sans-serif" font-size="11" fill="#b3261e" font-weight="700">e, quando possivel, vira SQL.</text>
<text x="742" y="424" font-family="DejaVu Sans, Segoe UI, Verdana, sans-serif" font-size="10.5" fill="#1f2933">O Editor Avancado mostra o codigo M</text>
<text x="742" y="440" font-family="DejaVu Sans, Segoe UI, Verdana, sans-serif" font-size="10.5" fill="#1f2933">equivalente: versionavel e revisavel.</text>
<text x="742" y="456" font-family="DejaVu Sans, Segoe UI, Verdana, sans-serif" font-size="10.5" fill="#1f2933"></text>
<text x="742" y="472" font-family="DejaVu Sans, Segoe UI, Verdana, sans-serif" font-size="10.5" fill="#1f2933">Value.NativeQuery(fonte, "SELECT ...",</text>
<text x="742" y="488" font-family="DejaVu Sans, Segoe UI, Verdana, sans-serif" font-size="10.5" fill="#1f2933">null, [EnableFolding = true])</text>
<text x="742" y="504" font-family="DejaVu Sans, Segoe UI, Verdana, sans-serif" font-size="10.5" fill="#1f2933">parte de um SQL proprio sem perder</text>
<text x="742" y="520" font-family="DejaVu Sans, Segoe UI, Verdana, sans-serif" font-size="10.5" fill="#1f2933">a dobra nas etapas seguintes.</text>
