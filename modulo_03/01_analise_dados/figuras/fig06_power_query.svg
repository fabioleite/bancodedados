<rect x="734" y="90" width="228" height="20" rx="0" fill="#e8edf3" stroke="#c9ced6" stroke-width="1"/>
<text x="742" y="104" font-family="DejaVu Sans, Segoe UI, Verdana, sans-serif" font-size="11" fill="#1f2933" font-weight="700">Configuracoes da Consulta</text>
<text x="742" y="128" font-family="DejaVu Sans, Segoe UI, Verdana, sans-serif" font-size="11" fill="#1f2933" font-weight="700">Etapas Aplicadas</text>
