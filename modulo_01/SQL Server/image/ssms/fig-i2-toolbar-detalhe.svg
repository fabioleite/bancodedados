<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 190" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="190" fill="#ffffff"/>
  <rect x="10" y="10" width="880" height="30" fill="#f7f7f7" stroke="#dcdcdc"/>

  <!-- 1: Nova consulta -->
  <rect x="20" y="15" width="96" height="20" fill="#ffffff" stroke="#c0c0c0"/>
  <text x="28" y="29" font-size="11" fill="#333">Nova Consulta</text>

  <!-- 2: seletor de banco -->
  <rect x="130" y="15" width="150" height="20" fill="#ffffff" stroke="#c0c0c0"/>
  <text x="138" y="29" font-size="11" fill="#333">DB_FISCAL</text>
  <polygon points="268,20 276,20 272,27" fill="#666"/>

  <!-- 3: Executar -->
  <rect x="292" y="15" width="70" height="20" fill="#dff0d8" stroke="#8bbf8b"/>
  <text x="300" y="29" font-size="11" fill="#2d6a2d">▶ Executar</text>

  <!-- 4: Analisar (parse) -->
  <rect x="374" y="15" width="60" height="20" fill="#ffffff" stroke="#c0c0c0"/>
  <text x="382" y="29" font-size="11" fill="#333">✓ Analisar</text>

  <!-- 5: Incluir plano real -->
  <rect x="446" y="15" width="200" height="20" fill="#fff3cd" stroke="#d8b45c"/>
  <text x="452" y="29" font-size="11" fill="#7a5c00">Incluir Plano de Execução Real</text>

  <!-- callouts -->
  <g font-size="13" fill="#ffffff" font-weight="bold">
    <circle cx="68" cy="60" r="11" fill="#3c5a78"/><text x="63" y="65">1</text>
    <circle cx="205" cy="60" r="11" fill="#3c5a78"/><text x="200" y="65">2</text>
    <circle cx="327" cy="60" r="11" fill="#3c5a78"/><text x="322" y="65">3</text>
    <circle cx="404" cy="60" r="11" fill="#3c5a78"/><text x="399" y="65">4</text>
    <circle cx="546" cy="60" r="11" fill="#3c5a78"/><text x="541" y="65">5</text>
  </g>
  <line x1="68" y1="35" x2="68" y2="50" stroke="#3c5a78"/>
  <line x1="205" y1="35" x2="205" y2="50" stroke="#3c5a78"/>
  <line x1="327" y1="35" x2="327" y2="50" stroke="#3c5a78"/>
  <line x1="404" y1="35" x2="404" y2="50" stroke="#3c5a78"/>
  <line x1="546" y1="35" x2="546" y2="50" stroke="#3c5a78"/>

  <!-- legenda -->
  <g font-size="11" fill="#222">
    <text x="20" y="100"><tspan font-weight="bold">1</tspan> — Abre uma nova aba de consulta em branco (Ctrl+N).</text>
    <text x="20" y="118"><tspan font-weight="bold">2</tspan> — Define em qual banco de dados o script será executado (ex.: DB_FISCAL).</text>
    <text x="20" y="136"><tspan font-weight="bold">3</tspan> — Executa o script da aba ativa (F5). Verifique sempre o banco selecionado antes de clicar.</text>
    <text x="20" y="154"><tspan font-weight="bold">4</tspan> — Verifica a sintaxe do script sem executá-lo (Ctrl+F5).</text>
    <text x="20" y="172"><tspan font-weight="bold">5</tspan> — Mostra o plano de execução real após rodar a consulta (Ctrl+M).</text>
  </g>
</svg>
