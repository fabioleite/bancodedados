<text x="36" y="354" font-family="DejaVu Sans, Segoe UI, Verdana, sans-serif" font-size="11" fill="#1f2933" font-weight="700">O que conferir sempre nesta saida</text>
<text x="36" y="372" font-family="DejaVu Sans, Segoe UI, Verdana, sans-serif" font-size="10.5" fill="#1f2933">o filtro de periodo cobre o intervalo correto e o mesmo periodo da EFD?</text>
<text x="36" y="388" font-family="DejaVu Sans, Segoe UI, Verdana, sans-serif" font-size="10.5" fill="#1f2933">o C100 comparado e do proprio declarante (id_contribuinte) e regular (cod_situacao = '00')?</text>
<text x="36" y="404" font-family="DejaVu Sans, Segoe UI, Verdana, sans-serif" font-size="10.5" fill="#1f2933">o total obtido bate com uma contagem de controle apurada por outro caminho?</text>
<text x="26" y="432" font-family="DejaVu Sans, Segoe UI, Verdana, sans-serif" font-size="11" fill="#b3261e" font-weight="700">O Copilot acelera a redacao - a responsabilidade pelo resultado continua sendo do auditor.</text>
<text x="26" y="452" font-family="DejaVu Sans, Segoe UI, Verdana, sans-serif" font-size="10.5" fill="#1f2933">Recursos (SSMS 21 e 22): conclusao de codigo em linha (Tab aceita a sugestao); chat com contexto</text>
<text x="26" y="469" font-family="DejaVu Sans, Segoe UI, Verdana, sans-serif" font-size="10.5" fill="#1f2933">do servidor e do banco; explicar consulta; corrigir erro de sintaxe; gerar consulta a partir de</text>
<text x="26" y="486" font-family="DejaVu Sans, Segoe UI, Verdana, sans-serif" font-size="10.5" fill="#1f2933">linguagem natural; modo agente (previa, SSMS 22.7). Exige conta GitHub com licenca Copilot e</text>
<text x="26" y="503" font-family="DejaVu Sans, Segoe UI, Verdana, sans-serif" font-size="10.5" fill="#b3261e" font-weight="700">habilitacao pela area de TI.  NAO cole dados de contribuinte no prompt.</text>
