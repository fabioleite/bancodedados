<text x="222" y="246" font-family="DejaVu Sans, Segoe UI, Verdana, sans-serif" font-size="10.5" fill="#0b57d0" font-weight="700">Consulta Nativa  (botao direito na etapa &gt; "Exibir Consulta Nativa")</text>
<text x="222" y="266" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="10" fill="#0000c0" textLength="36.138" lengthAdjust="spacing">select</text>
<text x="264.161" y="266" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="10" fill="#1f2933" textLength="307.173" lengthAdjust="spacing">[_].[cnpj], [_].[razao_social], [_].[data_emissao],</text>
<text x="264.161" y="282" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="10" fill="#1f2933" textLength="210.805" lengthAdjust="spacing">[_].[valor_total], [_].[valor_icms]</text>
<text x="222" y="298" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="10" fill="#0000c0" textLength="24.092" lengthAdjust="spacing">from</text>
<text x="252.115" y="298" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="10" fill="#1f2933" textLength="126.483" lengthAdjust="spacing">[dbo].[vw_nfe_saidas]</text>
<text x="384.621" y="298" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="10" fill="#0000c0" textLength="12.046" lengthAdjust="spacing">as</text>
<text x="402.69" y="298" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="10" fill="#1f2933" textLength="18.069" lengthAdjust="spacing">[_]</text>
<text x="222" y="314" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="10" fill="#0000c0" textLength="30.115" lengthAdjust="spacing">where</text>
<text x="258.138" y="314" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="10" fill="#1f2933" textLength="96.368" lengthAdjust="spacing">[_].[situacao] =</text>
<text x="360.529" y="314" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="10" fill="#a31515" textLength="72.276" lengthAdjust="spacing">'AUTORIZADA'</text>
<text x="438.828" y="314" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="10" fill="#0000c0" textLength="18.069" lengthAdjust="spacing">and</text>
<text x="462.92" y="314" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="10" fill="#1f2933" textLength="126.483" lengthAdjust="spacing">[_].[data_emissao] &gt;=</text>
<text x="595.426" y="314" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="10" fill="#a31515" textLength="72.276" lengthAdjust="spacing">'2025-01-01'</text>
<text x="240.069" y="330" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="10" fill="#0000c0" textLength="18.069" lengthAdjust="spacing">and</text>
<text x="264.161" y="330" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="10" fill="#1f2933" textLength="120.46" lengthAdjust="spacing">[_].[data_emissao] &lt;</text>
<text x="390.644" y="330" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="10" fill="#a31515" textLength="72.276" lengthAdjust="spacing">'2025-02-01'</text>
<text x="212" y="362" font-family="DejaVu Sans, Segoe UI, Verdana, sans-serif" font-size="10.5" fill="#1f2933">E o SQL que o Power Query GEROU SOZINHO a partir dos cliques - o chamado query</text>
<text x="212" y="378" font-family="DejaVu Sans, Segoe UI, Verdana, sans-serif" font-size="10.5" fill="#1f2933">folding (dobra da consulta): o filtro e a selecao de colunas sao executados no</text>
<text x="212" y="394" font-family="DejaVu Sans, Segoe UI, Verdana, sans-serif" font-size="10.5" fill="#1f2933">SQL Server, e nao na maquina do usuario. Se a opcao aparecer esmaecida, a dobra</text>
<text x="212" y="410" font-family="DejaVu Sans, Segoe UI, Verdana, sans-serif" font-size="10.5" fill="#1f2933">foi quebrada e todo o volume passa a trafegar para o desktop - o que, em base</text>
<text x="212" y="426" font-family="DejaVu Sans, Segoe UI, Verdana, sans-serif" font-size="10.5" fill="#1f2933">fiscal, e tecnicamente ruim e juridicamente arriscado.</text>
<rect x="212" y="436" width="500" height="72" rx="0" fill="#fdeaea" stroke="#c98b8b" stroke-width="1"/>
<text x="222" y="454" font-family="DejaVu Sans, Segoe UI, Verdana, sans-serif" font-size="11" fill="#1f2933" font-weight="700">Regra pratica</text>
<text x="222" y="471" font-family="DejaVu Sans, Segoe UI, Verdana, sans-serif" font-size="10.5" fill="#1f2933">Filtre primeiro (periodo, situacao, UF) e so depois transforme. Etapas que</text>
<text x="222" y="486" font-family="DejaVu Sans, Segoe UI, Verdana, sans-serif" font-size="10.5" fill="#1f2933">quebram a dobra - indices, colunas complexas, mesclagem com fonte local -</text>
<text x="222" y="501" font-family="DejaVu Sans, Segoe UI, Verdana, sans-serif" font-size="10.5" fill="#1f2933">devem vir por ultimo.</text>
