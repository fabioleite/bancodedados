<text x="710" y="132" font-family="DejaVu Sans, Segoe UI, Verdana, sans-serif" font-size="10.5" fill="#1f2933">Liste os contribuintes que emitiram NF-e</text>
<text x="710" y="148" font-family="DejaVu Sans, Segoe UI, Verdana, sans-serif" font-size="10.5" fill="#1f2933">de saida autorizadas em janeiro/2025 sem</text>
<text x="710" y="164" font-family="DejaVu Sans, Segoe UI, Verdana, sans-serif" font-size="10.5" fill="#1f2933">o C100 correspondente na EFD, somando o</text>
<text x="710" y="180" font-family="DejaVu Sans, Segoe UI, Verdana, sans-serif" font-size="10.5" fill="#1f2933">ICMS e ordenando pelo maior valor.</text>
<rect x="654" y="202" width="254" height="128" rx="6" fill="#eef4fd" stroke="#c3d6f0" stroke-width="1"/>
<text x="664" y="222" font-family="DejaVu Sans, Segoe UI, Verdana, sans-serif" font-size="10.5" fill="#1f2933">Gerei a consulta com NOT EXISTS em vez de</text>
<text x="664" y="238" font-family="DejaVu Sans, Segoe UI, Verdana, sans-serif" font-size="10.5" fill="#1f2933">NOT IN, porque chave_acesso e anulavel em</text>
<text x="664" y="254" font-family="DejaVu Sans, Segoe UI, Verdana, sans-serif" font-size="10.5" fill="#1f2933">efd_c100 e NOT IN retornaria conjunto vazio.</text>
<text x="664" y="270" font-family="DejaVu Sans, Segoe UI, Verdana, sans-serif" font-size="10.5" fill="#1f2933">Tambem troquei YEAR(data_emissao) = 2025</text>
<text x="664" y="286" font-family="DejaVu Sans, Segoe UI, Verdana, sans-serif" font-size="10.5" fill="#1f2933">por um intervalo de datas, para permitir o</text>
<text x="664" y="302" font-family="DejaVu Sans, Segoe UI, Verdana, sans-serif" font-size="10.5" fill="#1f2933">uso do indice em data_emissao.</text>
