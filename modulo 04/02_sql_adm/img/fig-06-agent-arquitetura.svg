<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="470" fill="#ffffff"/>
  <text x="20" y="28" font-size="13" font-weight="bold" fill="#243b53">Arquitetura do SQL Server Agent aplicada à carga de documentos fiscais</text>

  <!-- Agendamento -->
  <rect x="30" y="60" width="150" height="80" rx="6" fill="#eef4fa" stroke="#4a7ab0"/>
  <text x="105" y="86" font-size="12" text-anchor="middle" font-weight="bold" fill="#1b3f60">Agendamento</text>
  <text x="105" y="106" font-size="10" text-anchor="middle" fill="#33587a">Diário às 03:00</text>
  <text x="105" y="122" font-size="10" text-anchor="middle" fill="#33587a">(ou por evento/alerta)</text>

  <line x1="180" y1="100" x2="228" y2="100" stroke="#4a7ab0" stroke-width="2"/>
  <polygon points="234,100 224,95 224,105" fill="#4a7ab0"/>

  <!-- Agent -->
  <rect x="236" y="46" width="200" height="380" rx="6" fill="#f7fafd" stroke="#4a7ab0" stroke-width="2"/>
  <rect x="236" y="46" width="200" height="26" rx="6" fill="#4a7ab0"/>
  <text x="336" y="64" font-size="12" text-anchor="middle" font-weight="bold" fill="#ffffff">SQL Server Agent</text>
  <text x="336" y="92" font-size="11" text-anchor="middle" font-weight="bold" fill="#1b3f60">JOB: JOB_CARGA_NFE_DIARIA</text>

  <rect x="252" y="104" width="168" height="52" rx="4" fill="#ffffff" stroke="#8fa8be"/>
  <text x="262" y="120" font-size="10" font-weight="bold" fill="#243b53">Etapa 1 — Preparar staging</text>
  <text x="262" y="136" font-size="9.5" fill="#555">TRUNCATE stg.nota_fiscal_raw</text>
  <text x="262" y="150" font-size="9.5" fill="#555">Ao falhar: encerrar com falha</text>

  <rect x="252" y="164" width="168" height="52" rx="4" fill="#ffffff" stroke="#8fa8be"/>
  <text x="262" y="180" font-size="10" font-weight="bold" fill="#243b53">Etapa 2 — BULK INSERT</text>
  <text x="262" y="196" font-size="9.5" fill="#555">Carrega CSV de NF-e do dia</text>
  <text x="262" y="210" font-size="9.5" fill="#555">Ao falhar: encerrar com falha</text>

  <rect x="252" y="224" width="168" height="52" rx="4" fill="#ffffff" stroke="#8fa8be"/>
  <text x="262" y="240" font-size="10" font-weight="bold" fill="#243b53">Etapa 3 — Validar e mesclar</text>
  <text x="262" y="256" font-size="9.5" fill="#555">MERGE staging → dbo.nota_fiscal</text>
  <text x="262" y="270" font-size="9.5" fill="#555">Registra rejeitados</text>

  <rect x="252" y="284" width="168" height="52" rx="4" fill="#ffffff" stroke="#8fa8be"/>
  <text x="262" y="300" font-size="10" font-weight="bold" fill="#243b53">Etapa 4 — Pós-carga</text>
  <text x="262" y="316" font-size="9.5" fill="#555">UPDATE STATISTICS</text>
  <text x="262" y="330" font-size="9.5" fill="#555">Grava log de execução</text>

  <rect x="252" y="344" width="168" height="52" rx="4" fill="#fffaf0" stroke="#d9a13b"/>
  <text x="262" y="360" font-size="10" font-weight="bold" fill="#7a5c00">Etapa 5 — Alertar auditoria</text>
  <text x="262" y="376" font-size="9.5" fill="#7a5c00">Checagens de inconsistência</text>
  <text x="262" y="390" font-size="9.5" fill="#7a5c00">sp_send_dbmail se houver caso</text>

  <line x1="336" y1="156" x2="336" y2="162" stroke="#8fa8be"/>
  <line x1="336" y1="216" x2="336" y2="222" stroke="#8fa8be"/>
  <line x1="336" y1="276" x2="336" y2="282" stroke="#8fa8be"/>
  <line x1="336" y1="336" x2="336" y2="342" stroke="#8fa8be"/>

  <!-- entrada -->
  <rect x="30" y="180" width="150" height="80" rx="6" fill="#f4f7f4" stroke="#5aa35a"/>
  <text x="105" y="204" font-size="11" text-anchor="middle" font-weight="bold" fill="#2d6a2d">Arquivos de origem</text>
  <text x="105" y="222" font-size="9.5" text-anchor="middle" fill="#3d6b3d">E:\Cargas\NFe\*.csv</text>
  <text x="105" y="238" font-size="9.5" text-anchor="middle" fill="#3d6b3d">extraídos dos XML</text>
  <text x="105" y="252" font-size="9.5" text-anchor="middle" fill="#3d6b3d">de NF-e / CT-e</text>
  <line x1="180" y1="200" x2="248" y2="190" stroke="#5aa35a" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- saidas -->
  <line x1="436" y1="250" x2="500" y2="150" stroke="#4a7ab0" stroke-width="2"/>
  <polygon points="504,144 492,148 500,156" fill="#4a7ab0"/>
  <rect x="506" y="110" width="180" height="70" rx="6" fill="#eef4fa" stroke="#4a7ab0"/>
  <text x="596" y="134" font-size="11" text-anchor="middle" font-weight="bold" fill="#1b3f60">Base analítica</text>
  <text x="596" y="152" font-size="9.5" text-anchor="middle" fill="#33587a">DB_FISCAL — dbo.nota_fiscal</text>
  <text x="596" y="168" font-size="9.5" text-anchor="middle" fill="#33587a">pronta para consulta do auditor</text>

  <line x1="436" y1="290" x2="500" y2="290" stroke="#4a7ab0" stroke-width="2"/>
  <polygon points="506,290 494,285 494,295" fill="#4a7ab0"/>
  <rect x="506" y="256" width="180" height="70" rx="6" fill="#fffaf0" stroke="#d9a13b"/>
  <text x="596" y="280" font-size="11" text-anchor="middle" font-weight="bold" fill="#7a5c00">Database Mail</text>
  <text x="596" y="298" font-size="9.5" text-anchor="middle" fill="#7a5c00">Falha do job → DBA</text>
  <text x="596" y="314" font-size="9.5" text-anchor="middle" fill="#7a5c00">Inconsistências → auditoria</text>

  <line x1="436" y1="370" x2="500" y2="400" stroke="#4a7ab0" stroke-width="2"/>
  <polygon points="506,404 496,395 494,406" fill="#4a7ab0"/>
  <rect x="506" y="372" width="180" height="62" rx="6" fill="#f5f5f7" stroke="#9a9aa8"/>
  <text x="596" y="394" font-size="11" text-anchor="middle" font-weight="bold" fill="#3a3a48">Histórico do Job</text>
  <text x="596" y="412" font-size="9.5" text-anchor="middle" fill="#55556a">msdb.dbo.sysjobhistory</text>
  <text x="596" y="426" font-size="9.5" text-anchor="middle" fill="#55556a">auditável, com data/hora</text>

  <!-- consumidores -->
  <rect x="716" y="110" width="160" height="324" rx="6" fill="#fcfcfd" stroke="#c0c6cc"/>
  <text x="796" y="134" font-size="11" text-anchor="middle" font-weight="bold" fill="#243b53">Consumo pelo auditor</text>
  <rect x="732" y="150" width="128" height="46" rx="4" fill="#ffffff" stroke="#c0c6cc"/>
  <text x="796" y="170" font-size="10" text-anchor="middle" fill="#333">SSMS</text>
  <text x="796" y="186" font-size="9" text-anchor="middle" fill="#777">consultas ad hoc</text>
  <rect x="732" y="206" width="128" height="46" rx="4" fill="#ffffff" stroke="#c0c6cc"/>
  <text x="796" y="226" font-size="10" text-anchor="middle" fill="#333">VS Code + MSSQL</text>
  <text x="796" y="242" font-size="9" text-anchor="middle" fill="#777">consulta multiplataforma</text>
  <rect x="732" y="262" width="128" height="46" rx="4" fill="#ffffff" stroke="#c0c6cc"/>
  <text x="796" y="282" font-size="10" text-anchor="middle" fill="#333">Excel / Power BI</text>
  <text x="796" y="298" font-size="9" text-anchor="middle" fill="#777">painéis de fiscalização</text>
  <rect x="732" y="318" width="128" height="46" rx="4" fill="#ffffff" stroke="#c0c6cc"/>
  <text x="796" y="338" font-size="10" text-anchor="middle" fill="#333">SSRS</text>
  <text x="796" y="354" font-size="9" text-anchor="middle" fill="#777">relatórios corporativos</text>
  <line x1="686" y1="145" x2="712" y2="160" stroke="#c0c6cc" stroke-width="2"/>
</svg>
