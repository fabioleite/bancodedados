<text x="510" y="458" font-family="DejaVu Sans, Segoe UI, Verdana, sans-serif" font-size="11" fill="#1f2933" font-weight="700">Como ler o diagrama</text>
<text x="510" y="476" font-family="DejaVu Sans, Segoe UI, Verdana, sans-serif" font-size="10.5" fill="#1f2933">Circulo = lado "um" (chave primaria)   |   Seta = lado "muitos" (chave estrangeira)</text>
<text x="510" y="492" font-family="DejaVu Sans, Segoe UI, Verdana, sans-serif" font-size="10.5" fill="#1f2933">O desenho e lido do catalogo do banco: mostra o modelo REAL, nao o previsto</text>
<text x="510" y="508" font-family="DejaVu Sans, Segoe UI, Verdana, sans-serif" font-size="10.5" fill="#1f2933">no projeto. Serve para (1) descobrir por onde as tabelas se ligam antes de</text>
<text x="510" y="524" font-family="DejaVu Sans, Segoe UI, Verdana, sans-serif" font-size="10.5" fill="#1f2933">escrever um JOIN e (2) conferir se as chaves estrangeiras existem - ausencia</text>
<text x="510" y="540" font-family="DejaVu Sans, Segoe UI, Verdana, sans-serif" font-size="10.5" fill="#1f2933">de linha entre duas tabelas costuma significar integridade referencial nao</text>
<text x="510" y="556" font-family="DejaVu Sans, Segoe UI, Verdana, sans-serif" font-size="10.5" fill="#1f2933">declarada no banco.</text>
