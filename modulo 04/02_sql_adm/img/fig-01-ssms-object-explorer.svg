  <!-- Editor -->
  <rect x="278" y="92" width="604" height="180" fill="#ffffff" stroke="#c8c8c8"/>
  <rect x="278" y="92" width="604" height="20" fill="#e1e8ef" stroke="#c8c8c8"/>
  <text x="286" y="106" font-size="11" fill="#243b53">SQLQuery1.sql - SRV-FISCAL01.DB_FISCAL</text>
  <g font-family="Consolas, monospace" font-size="12">
    <text x="288" y="132" fill="#0000ff">SELECT</text><text x="340" y="132" fill="#222"> cnpj_emitente, COUNT(*) AS qtd, SUM(vl_total) AS total</text>
    <text x="288" y="152" fill="#0000ff">FROM</text><text x="330" y="152" fill="#222"> dbo.nota_fiscal</text>
    <text x="288" y="172" fill="#0000ff">WHERE</text><text x="340" y="172" fill="#222"> dt_emissao </text><text x="440" y="172" fill="#0000ff">BETWEEN</text><text x="502" y="172" fill="#a31515"> '2025-01-01' </text><text x="600" y="172" fill="#0000ff">AND</text><text x="632" y="172" fill="#a31515"> '2025-12-31'</text>
    <text x="288" y="192" fill="#0000ff">GROUP BY</text><text x="360" y="192" fill="#222"> cnpj_emitente</text>
    <text x="288" y="212" fill="#0000ff">HAVING</text><text x="348" y="212" fill="#222"> SUM(vl_total) </text><text x="452" y="212" fill="#222">&gt; 1000000</text>
    <text x="288" y="232" fill="#0000ff">ORDER BY</text><text x="360" y="232" fill="#222"> total </text><text x="404" y="232" fill="#0000ff">DESC</text><text x="440" y="232" fill="#222">;</text>
  </g>

